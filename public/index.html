<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveBackup · rclone 单向备份</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --txt:#1c2330; --sub:#6b7688; --pri:#2563eb; --ok:#16a34a; --err:#dc2626; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); padding:20px; max-width:1080px; margin:0 auto; }
h1 { font-size:22px; margin-bottom:4px; }
h2 { font-size:16px; margin:22px 0 10px; }
.sub { color:var(--sub); font-size:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.remotes .r { display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; justify-content:space-between; }
button { padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; }
button.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
button.danger { color:var(--err); }
button:disabled { opacity:.5; cursor:not-allowed; }
input, select { padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
input.wide { flex:1; min-width:280px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--sub); font-weight:500; }
.badge { padding:1px 8px; border-radius:99px; font-size:12px; }
.badge.ok { background:#dcfce7; color:var(--ok); }
.badge.err { background:#fee2e2; color:var(--err); }
.badge.run { background:#dbeafe; color:var(--pri); }
.badge.warn { background:#fef3c7; color:#b45309; }
#log { background:#0f172a; color:#e2e8f0; font:12px/1.5 ui-monospace,Menlo,monospace; padding:12px; border-radius:8px; height:260px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
label { font-size:12px; color:var(--sub); display:block; margin-bottom:3px; }
.field { margin-bottom:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.formwrap { margin-top:10px; }
.muted { color:var(--sub); }
.actions button { margin-right:6px; margin-bottom:4px; }
#toast { position:fixed; bottom:20px; right:20px; background:#111827; color:#fff; padding:10px 16px; border-radius:8px; display:none; z-index:9; }
</style>
</head>
<body>
<h1>DriveBackup</h1>
<p class="sub">把 rclone 变成傻瓜式单向备份 · sync 源 → 目标，删除/修改自动落到 backup/&lt;日期&gt; 目录</p>

<h2>① Google Drive 账号</h2>
<div class="card remotes" id="remotesBox"></div>
<div class="row">
  <input id="newRemoteName" placeholder="新 remote 名，如 gdrive3" style="width:200px">
  <button class="pri" onclick="authorize()">+ 连接新的 Google 账号</button>
  <span class="muted">点击后会弹出 Google 登录窗口，授权后自动写入 rclone 配置</span>
</div>

<h2>② 备份任务</h2>
<div class="card" id="tasksBox"></div>
<div class="row" style="margin-top:10px">
  <button class="pri" onclick="toggleForm()">＋ 新建任务</button>
</div>
<div class="card formwrap" id="taskForm" style="display:none">
  <div class="field"><label>任务名称</label><input id="f_name" placeholder="如：工作文档备份" style="width:300px"></div>
  <div class="field"><label>本地源文件夹</label>
    <div class="row"><input id="f_src" class="wide" placeholder="/Users/you/Documents/work"><button onclick="browse($('#f_src').value||'~')">浏览…</button></div>
    <div id="browser" style="display:none;margin-top:6px"></div>
  </div>
  <div class="field"><label>目标（remote:路径，例如 gdrive1:Backups/work）</label><input id="f_dest" style="width:420px" placeholder="gdrive1:Backups/work"></div>
  <div class="grid2">
    <div class="field"><label>计划</label>
      <select id="f_schedType" onchange="schedChanged()">
        <option value="manual">手动</option>
        <option value="daily">每天</option>
        <option value="weekly">每周</option>
      </select>
      <span id="schedExtra" style="display:none;margin-left:8px">
        <select id="f_weekday">
          <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
          <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option>
        </select>
        <input id="f_time" value="03:00" style="width:70px" title="HH:mm">
      </span>
    </div>
    <div class="field"><label>保留删除/修改的天数（--backup-dir，0 = 不保留）</label><input id="f_retention" type="number" value="30" min="0" max="3650" style="width:100px"></div>
    <div class="field"><label>上传限速（可选，如 10MiB/s）</label><input id="f_bandwidth" style="width:140px" placeholder="不限"></div>
  </div>
  <button class="pri" onclick="createTask()">创建任务</button>
  <button onclick="toggleForm()">取消</button>
</div>

<h2>③ 运行记录</h2>
<div class="card">
  <table id="runsTable"><thead><tr><th>时间</th><th>任务</th><th>类型</th><th>状态</th><th>传输量</th><th>耗时</th><th>退出码</th><th></th></tr></thead><tbody></tbody></table>
  <div id="log" style="margin-top:10px">（点某条运行记录的「查看日志」实时查看输出）</div>
</div>

<h2>④ 备份目录与恢复</h2>
<div class="card">
  <div class="row">
    <select id="bk_task" style="width:auto" onchange="loadBackups()"></select>
    <button onclick="loadBackups()">刷新</button>
    <button onclick="browseRemote()">浏览远端…</button>
    <span class="muted">选择任务查看它的 backup/&lt;日期&gt; 目录，可一键把某天的快照恢复回源文件夹</span>
  </div>
  <div id="backupsBox" style="margin-top:10px"></div>
</div>

<div id="remoteModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10">
  <div class="card" style="max-width:640px;margin:60px auto;max-height:70vh;overflow:auto">
    <div class="row"><b>远端浏览</b><input id="rm_path" class="wide" placeholder="gdrive1:"><button onclick="goRemote()">跳转</button><button onclick="$('#remoteModal').style.display='none'">关闭</button></div>
    <div id="remoteBox" style="margin-top:8px"></div>
  </div>
</div>

<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let pollTimer = null;

function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg;
  t.style.display = 'block'; t.style.background = isErr ? '#7f1d1d' : '#111827';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- remotes ----
async function loadRemotes() {
  const { remotes } = await api('/api/remotes');
  const box = $('#remotesBox');
  if (!remotes.length) { box.innerHTML = '<span class="muted">还没有连接任何 remote，在下方连接 Google 账号</span>'; return; }
  box.innerHTML = remotes.map(r => `
    <div class="r"><b>${esc(r.name)}</b>
      <span>${r.connected ? '<span class="badge ok">已连接</span>' : '<span class="badge warn">未授权</span>'}
      ${r.connected ? '' : `<button onclick="authorize('${esc(r.name)}')">授权</button>`}</span>
    </div>`).join('');
}
async function authorize(name) {
  name = name || $('#newRemoteName').value.trim() || 'gdrive1';
  toast('已发起授权，请在弹出的 Google 窗口里登录…');
  try {
    await api('/api/authorize', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
    toast(`已连接并写入配置: ${name}`); loadRemotes();
  } catch (e) { toast('授权失败: ' + e.message, true); }
}

// ---- 浏览目录 ----
async function browse(p) {
  try {
    const data = await api('/api/ls?path=' + encodeURIComponent(p || '~/'));
    const b = $('#browser'); b.style.display = 'block';
    const rows = [{name:'📁 ..（上一级）', path:data.parent}].concat(data.entries.map(e => ({name:'📁 '+e.name, path:e.path})));
    b.innerHTML = `<div class="sub">${esc(data.path)}</div>` + rows.map(r =>
      `<div style="cursor:pointer;padding:2px 4px" onclick="pick('${esc(r.path).replace(/'/g,"\\'")}')">${esc(r.name)}</div>`).join('');
  } catch (e) { toast(e.message, true); }
}
function pick(p) { $('#f_src').value = p; $('#browser').style.display = 'none'; }

// ---- 任务 ----
function toggleForm() { $('#taskForm').style.display = $('#taskForm').style.display === 'none' ? 'block' : 'none'; }
function schedChanged() {
  $('#schedExtra').style.display = $('#f_schedType').value === 'manual' ? 'none' : 'inline';
  $('#f_weekday').style.display = $('#f_schedType').value === 'weekly' ? 'inline' : 'none';
}
async function createTask() {
  const type = $('#f_schedType').value;
  const body = {
    name: $('#f_name').value, src: $('#f_src').value, dest: $('#f_dest').value,
    retentionDays: Number($('#f_retention').value),
    bandwidth: $('#f_bandwidth').value.trim() || undefined,
    schedule: { type, time: $('#f_time').value, weekday: type === 'weekly' ? Number($('#f_weekday').value) : undefined },
  };
  try {
    await api('/api/tasks', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    toast('任务已创建'); toggleForm(); loadTasks(); $('#bk_task').innerHTML = ''; loadBackups();
    ['f_name','f_src','f_dest','f_bandwidth'].forEach(id => $('#'+id).value = '');
  } catch (e) { toast(e.message, true); }
}
function schedText(t) {
  const s = t.schedule;
  if (!s || s.type === 'manual') return '手动';
  const extra = s.type === 'weekly' ? ['周日','周一','周二','周三','周四','周五','周六'][Number(s.weekday)] + ' ' : '';
  return (s.type === 'daily' ? '每天 ' : '每周 ') + extra + (s.time || '');
}
let apiCacheTasks = null;
async function loadTasks() {
  const { tasks, lastRunDate } = await api('/api/tasks');
  apiCacheTasks = { tasks };
  const box = $('#tasksBox');
  if (!tasks.length) { box.innerHTML = '<span class="muted">还没有任务，点「＋ 新建任务」创建一个</span>'; return; }
  box.innerHTML = '<table><thead><tr><th>名称</th><th>源 → 目标</th><th>计划</th><th>保留</th><th>今天已跑</th><th class="actions">操作</th></tr></thead><tbody>' +
    tasks.map(t => `<tr>
      <td><b>${esc(t.name)}</b></td>
      <td class="muted" style="max-width:340px;word-break:break-all">${esc(t.src)}<br>→ ${esc(t.dest)}</td>
      <td>${schedText(t)}</td>
      <td>${t.retentionDays > 0 ? t.retentionDays + ' 天' : '不保留'}</td>
      <td>${lastRunDate[t.id] ? '✅' : '—'}</td>
      <td class="actions">
        <button class="pri" onclick="run('${t.id}', false)">立即运行</button>
        <button onclick="run('${t.id}', true)">dry-run 预览</button>
        <button class="danger" onclick="delTask('${t.id}', '${esc(t.name)}')">删除</button>
      </td></tr>`).join('') + '</tbody></table>';
}
async function run(id, dryRun) {
  try {
    const { run } = await api(`/api/tasks/${id}/run`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ dryRun }) });
    toast(dryRun ? 'dry-run 预览已启动' : '备份已启动');
    watchRun(run.id); loadRuns();
  } catch (e) { toast(e.message, true); }
}
async function delTask(id, name) {
  if (!confirm(`删除任务「${name}」？（不影响已备份的数据）`)) return;
  await api(`/api/tasks/${id}`, { method:'DELETE' });
  loadTasks(); $('#bk_task').innerHTML = ''; loadBackups();
}

// ---- 运行记录 ----
function statusBadge(r) {
  if (r.status === 'running') return '<span class="badge run">运行中</span>';
  return r.exitCode === 0 ? '<span class="badge ok">成功</span>' : `<span class="badge err">失败 (${r.exitCode})</span>`;
}
async function loadRuns() {
  const { runs } = await api('/api/runs');
  $('#runsTable tbody').innerHTML = runs.length ? runs.map(r => `<tr>
    <td>${esc(new Date(r.startedAt).toLocaleString('zh-CN'))}</td>
    <td>${esc(r.taskName)}</td>
    <td>${r.dryRun ? '<span class="badge warn">dry-run</span>' : '真实备份'}</td>
    <td>${statusBadge(r)}</td>
    <td>${esc(r.bytes || '—')}</td>
    <td>${r.durationSec != null ? fmtDur(r.durationSec) : '—'}</td>
    <td>${r.exitCode === null ? '—' : r.exitCode}</td>
    <td><button onclick="watchRun('${r.id}')">查看日志</button></td>
  </tr>`).join('') : '<tr><td colspan="8" class="muted">暂无运行记录</td></tr>';
}
function fmtDur(sec) {
  if (sec < 60) return sec + ' 秒';
  const m = Math.floor(sec / 60), s2 = sec % 60;
  return m + ' 分 ' + s2 + ' 秒';
}
function watchRun(id) {
  clearInterval(pollTimer);
  const el = $('#log');
  const tick = async () => {
    try {
      const { run, log } = await api('/api/runs/' + id);
      el.textContent = log || '（暂无输出）';
      el.scrollTop = el.scrollHeight;
      if (run.status !== 'running') { clearInterval(pollTimer); pollTimer = null; loadRuns(); loadTasks(); }
    } catch {}
  };
  tick();
  pollTimer = setInterval(tick, 1000);
}

async function loadBackups() {
  const sel = $('#bk_task');
  if (sel.options.length === 0) {
    const { tasks } = await api('/api/tasks');
    sel.innerHTML = tasks.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('') || '<option value="">（暂无任务）</option>';
    if (!tasks.length) { $('#backupsBox').innerHTML = '<span class="muted">先创建任务</span>'; return; }
  }
  const id = sel.value;
  if (!id) return;
  const { backups } = await api('/api/backups/' + id);
  $('#backupsBox').innerHTML = backups.length ? '<table><thead><tr><th>备份日期</th><th>文件数</th><th>大小</th><th class="actions">操作</th></tr></thead><tbody>' +
    backups.map(b => `<tr>
      <td><b>${esc(b.date)}</b></td>
      <td>${b.files ?? '—'}</td>
      <td>${b.bytes != null ? (b.bytes > 1048576 ? (b.bytes/1048576).toFixed(1)+' MiB' : b.bytes+' B') : '—'}</td>
      <td class="actions">
        <button class="pri" onclick="restore('${esc(b.date)}', false)">恢复到源</button>
        <button onclick="restore('${esc(b.date)}', true)">dry-run</button>
      </td></tr>`).join('') + '</tbody></table>'
    : '<span class="muted">该任务还没有备份目录（开启保留天数并运行过、且有删除/修改时才会生成）</span>';
}
async function restore(date, dryRun) {
  if (!dryRun && !confirm(`把 ${date} 的备份快照复制回源文件夹？
（rclone copy：只补回旧文件，不删除后来新增的文件）`)) return;
  const id = $('#bk_task').value;
  const { runId } = await api(`/api/backups/${id}/restore`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ date, dryRun }) });
  toast(dryRun ? '恢复预览已启动' : '恢复已启动');
  watchRun(runId); loadRuns();
}
async function goRemote(path) {
  try {
    const data = await api('/api/remote/ls?path=' + encodeURIComponent(path ?? $('#rm_path').value));
    $('#rm_path').value = data.path;
    const rows = [{name:'📁 ..', path:data.parent, dir:true}].concat(data.entries.map(e => ({name:(e.isDir?'📁 ':'📄 ')+e.name+(e.isDir?'':' ('+ (e.size>=1048576?(e.size/1048576).toFixed(1)+'MiB':e.size+'B') +')'), path:e.path, dir:e.isDir})));
    $('#remoteBox').innerHTML = rows.map(r =>
      `<div style="cursor:${r.dir?'pointer':'default'};padding:2px 4px" ${r.dir?`onclick="goRemote('${esc(r.path).replace(/'/g,"\'")}')"`:''}>${esc(r.name)}</div>`).join('');
  } catch (e) { toast(e.message, true); }
}
function browseRemote() {
  $('#remoteModal').style.display = 'block';
  const sel = $('#bk_task');
  const { tasks } = apiCacheTasks || {};
  if (tasks) { const t = tasks.find(x => x.id === sel.value); if (t) $('#rm_path').value = t.dest; }
  goRemote($('#rm_path').value || $('#rm_path').placeholder);
}
loadRemotes(); loadTasks(); loadRuns(); loadBackups();
setInterval(loadRuns, 10000);
</script>
</body>
</html>
